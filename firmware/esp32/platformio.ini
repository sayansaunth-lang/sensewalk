; SENSEWALK ESP32-S3 firmware
; https://docs.platformio.org/page/projects/configuration.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    pololu/VL53L1X @ ^1.3.1
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
build_flags =
    -Wall
    -Wextra
    -std=gnu++17

; Simulated-sensor build: only the sensor readings are faked (a scripted 40 s
; scenario); hazard rules, brake and UART are the real code. Demo/bench only.
[env:esp32-s3-sim]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DSENSEWALK_SIM_SENSORS
    -DARDUINO_USB_CDC_ON_BOOT=1

; One-sensor build: a single VL53L0X as the forward obstacle sensor, no drop-off detection.
[env:esp32-s3-one-l0x]
extends = env:esp32-s3-devkitc-1
lib_deps =
    pololu/VL53L0X @ ^1.3.1
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    pololu/VL53L1X @ ^1.3.1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DSENSEWALK_TOF_VL53L0X_FORWARD_ONLY
    -DARDUINO_USB_CDC_ON_BOOT=1

; Host-native environment: builds and runs unit tests for the pure-logic
; modules (safety threshold rules, UART checksum/framing) on the dev
; machine / CI runner directly, with no ESP32 hardware or toolchain
; involved. Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNIT_TEST_NATIVE
