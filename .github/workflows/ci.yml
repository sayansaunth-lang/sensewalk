name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    name: Python unit tests (comms, fusion, speech, vision)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system Tesseract (for pytesseract import)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -v

  firmware-build:
    name: ESP32-S3 firmware build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware for esp32-s3-devkitc-1
        working-directory: firmware/esp32
        run: pio run -e esp32-s3-devkitc-1
      - name: Build the simulated-sensor firmware (PlatformIO)
        working-directory: firmware/esp32
        run: pio run -e esp32-s3-sim
      - name: Build the one-VL53L0X firmware (PlatformIO)
        working-directory: firmware/esp32
        run: pio run -e esp32-s3-one-l0x

  firmware-native-tests:
    name: Firmware host-native unit tests (safety rules, UART codec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run native unit tests
        working-directory: firmware/esp32
        run: pio test -e native

  arduino-ide-sketches:
    name: Arduino IDE sketches compile (latest ESP32 core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries (what Arduino IDE's Boards/Library Manager would install)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "VL53L1X" "VL53L0X" "Adafruit MPU6050" "Chirale_TensorFLowLite"
      - name: Compile the bring-up blink test
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/esp32_arduino_ide/SENSEWALK_blink_test
      - name: Compile the I2C wiring scanner
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/esp32_arduino_ide/SENSEWALK_i2c_scan
      - name: Compile the single-ToF bench test
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/esp32_arduino_ide/SENSEWALK_tof_test
      - name: Compile the VL53L0X bench test
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/esp32_arduino_ide/SENSEWALK_vl53l0x_test
      - name: Compile the ESP32-S3 camera board test
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3:PSRAM=opi firmware/esp32_arduino_ide/SENSEWALK_cam_test
      - name: Pothole network matches PyTorch (host test) and UART protocol copy has not drifted
        run: |
          g++ -O2 -std=c++17 -I firmware/esp32_arduino_ide/SENSEWALK_cam_main firmware/esp32_arduino_ide/tools/test_pothole_net.cpp -o /tmp/test_pothole_net
          /tmp/test_pothole_net
          g++ -O2 -std=c++17 -I firmware/esp32_arduino_ide/SENSEWALK_cam_main firmware/esp32_arduino_ide/tools/test_voice.cpp -o /tmp/test_voice
          /tmp/test_voice
          diff firmware/esp32_arduino_ide/SENSEWALK_ESP32/uart_protocol.h firmware/esp32_arduino_ide/SENSEWALK_cam_main/uart_protocol.h
      - name: Compile the camera board person + pothole firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB firmware/esp32_arduino_ide/SENSEWALK_cam_main
      - name: Compile the full firmware sketch
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/esp32_arduino_ide/SENSEWALK_ESP32
      - name: Export flashable binaries (USB-CDC serial output on)
        run: |
          for sk in SENSEWALK_blink_test SENSEWALK_ESP32 SENSEWALK_i2c_scan SENSEWALK_tof_test SENSEWALK_vl53l0x_test; do
            arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc --export-binaries firmware/esp32_arduino_ide/$sk
          done
          # Simulated-sensor build: same sketch with SENSEWALK_SIM_SENSORS defined (demo only)
          rm -rf sim_build && mkdir sim_build
          cp -r firmware/esp32_arduino_ide/SENSEWALK_ESP32 sim_build/SENSEWALK_ESP32_SIM
          mv sim_build/SENSEWALK_ESP32_SIM/SENSEWALK_ESP32.ino sim_build/SENSEWALK_ESP32_SIM/SENSEWALK_ESP32_SIM.ino
          sed -i 's|^// #define SENSEWALK_SIM_SENSORS|#define SENSEWALK_SIM_SENSORS|' sim_build/SENSEWALK_ESP32_SIM/config.h
          grep -q '^#define SENSEWALK_SIM_SENSORS' sim_build/SENSEWALK_ESP32_SIM/config.h
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc --export-binaries sim_build/SENSEWALK_ESP32_SIM
          # One-sensor build: a single VL53L0X as forward sensor (no drop-off detection)
          cp -r firmware/esp32_arduino_ide/SENSEWALK_ESP32 sim_build/SENSEWALK_ESP32_ONE_L0X
          mv sim_build/SENSEWALK_ESP32_ONE_L0X/SENSEWALK_ESP32.ino sim_build/SENSEWALK_ESP32_ONE_L0X/SENSEWALK_ESP32_ONE_L0X.ino
          sed -i 's|^// #define SENSEWALK_TOF_VL53L0X_FORWARD_ONLY|#define SENSEWALK_TOF_VL53L0X_FORWARD_ONLY|' sim_build/SENSEWALK_ESP32_ONE_L0X/config.h
          grep -q '^#define SENSEWALK_TOF_VL53L0X_FORWARD_ONLY' sim_build/SENSEWALK_ESP32_ONE_L0X/config.h
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc --export-binaries sim_build/SENSEWALK_ESP32_ONE_L0X
          mkdir -p flash && find firmware/esp32_arduino_ide sim_build -name "*.ino.merged.bin" -exec cp {} flash/ \;
          # Camera board test: N16R8 boards use octal PSRAM, some clones use quad
          for psram in opi enabled; do
            arduino-cli compile --fqbn esp32:esp32:esp32s3:PSRAM=$psram --export-binaries firmware/esp32_arduino_ide/SENSEWALK_cam_test
            cp firmware/esp32_arduino_ide/SENSEWALK_cam_test/build/*/SENSEWALK_cam_test.ino.merged.bin flash/SENSEWALK_cam_test_$psram.merged.bin
          done
          arduino-cli compile --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB --export-binaries firmware/esp32_arduino_ide/SENSEWALK_cam_main
          cp firmware/esp32_arduino_ide/SENSEWALK_cam_main/build/*/SENSEWALK_cam_main.ino.merged.bin flash/SENSEWALK_cam_main_opi.merged.bin
          # Same firmware with USB-CDC serial: for boards plugged into the native-USB connector (no serial chip)
          arduino-cli compile --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc --export-binaries firmware/esp32_arduino_ide/SENSEWALK_cam_main
          cp firmware/esp32_arduino_ide/SENSEWALK_cam_main/build/*/SENSEWALK_cam_main.ino.merged.bin flash/SENSEWALK_cam_main_cdc.merged.bin
      - name: Upload flashable binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: flash/*.merged.bin
