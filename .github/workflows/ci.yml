name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    name: Python unit tests (comms, fusion, speech, vision)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system Tesseract (for pytesseract import)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -v

  firmware-build:
    name: ESP32-S3 firmware build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware for esp32-s3-devkitc-1
        working-directory: firmware/esp32
        run: pio run -e esp32-s3-devkitc-1

  firmware-native-tests:
    name: Firmware host-native unit tests (safety rules, UART codec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run native unit tests
        working-directory: firmware/esp32
        run: pio test -e native

  arduino-ide-sketches:
    name: Arduino IDE sketches compile (latest ESP32 core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries (what Arduino IDE's Boards/Library Manager would install)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "VL53L1X" "Adafruit MPU6050"
      - name: Compile the bring-up blink test
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/esp32_arduino_ide/SENSEWALK_blink_test
      - name: Compile the full firmware sketch
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/esp32_arduino_ide/SENSEWALK_ESP32
